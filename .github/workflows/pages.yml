name: Publish NFL Decision Lab

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "data/**"
      - "tools/**"
      - "research/**"
      - "docs/**"
      - "*.html"
      - "*.css"
      - "*.js"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Prove the data against the official NFL.com standings
        run: python3 tools/verify.py
      - name: Rebuild the published numbers and the site
        run: |
          python3 tools/build.py
          python3 tools/pages.py
          python3 tools/sync.py
      - name: Check the published site and the repository-root copy
        run: |
          python3 site/check.py
          python3 site/check.py .
      - name: Confirm the published output is reproducible
        run: |
          git diff --exit-code || (
            echo "::error::The committed output does not match a fresh build."
            echo "Run 'python3 tools/build.py && python3 tools/pages.py && python3 tools/sync.py' and commit the result."
            exit 1
          )
      - name: Check the X4 Console (docs/) for broken links and unsourced rows
        run: node docs/check.js
      - name: Add the X4 Console (docs/) to the published artifact
        run: |
          rm -rf site/console
          mkdir -p site/console
          cp -R docs/. site/console/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

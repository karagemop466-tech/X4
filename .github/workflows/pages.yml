name: Publish NFL Decision Lab

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "data/**"
      - "tools/**"
      - "research/**"
      - "docs/**"
      - "console/**"
      - "*.html"
      - "*.css"
      - "*.js"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run the full publication gate
        # One gate, in order: prove the data against the official NFL.com
        # standings, rebuild every published number, rebuild the site, re-derive
        # the market numbers independently, reconcile the two price captures,
        # check every published page for broken links and unsourced rows, check
        # the repository-root copy and the X4 Console, and prove the whole build
        # is byte-for-byte reproducible.
        run: python3 tools/validate.py
      - name: Check the X4 Console (docs/) for broken links and unsourced rows
        run: node docs/check.js
      - name: Confirm the published output is reproducible
        run: |
          git diff --exit-code -- site data research *.html *.css *.js || (
            echo "::error::The committed output does not match a fresh build."
            echo "Run 'python3 tools/validate.py' and commit the result."
            exit 1
          )
      - name: Add the X4 Console (docs/) to the published artifact
        run: |
          rm -rf site/console
          mkdir -p site/console
          cp -R docs/. site/console/
          rm -f site/console/check.js
      - name: Confirm the repository-root mirror is in step
        run: |
          diff -rq --exclude=check.js docs console
          # T32-b (2026-11-14, arena/e6ee28a8-x4): the two session-artifact
          # directories committed with the PR #24/#25 capture work are
          # repository content, not site content, and sit only at the root -
          # exactly like data/, tools/ and research/, which are excluded for
          # the same reason. Without these excludes the step fails with
          # "Only in .: .retrieval / .scratch" (run 43635100704), a latent
          # failure that was masked until the float-drift repair above made
          # the reproducibility step pass.
          diff -rq --exclude=check.py --exclude=site --exclude=console --exclude=docs \
            --exclude=data --exclude=tools --exclude=research --exclude=.git \
            --exclude=.github --exclude=README.md --exclude=COORDINATION.md \
            --exclude=.gitignore --exclude=.retrieval --exclude=.scratch \
            site .
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

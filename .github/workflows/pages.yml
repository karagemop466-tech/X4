name: Publish NFL Decision Lab

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "data/**"
      - "tools/**"
      - "research/**"
      - "docs/**"
      - "console/**"
      - "*.html"
      - "*.css"
      - "*.js"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# T32 diagnostic: `contents: write` is needed only so the diagnostic step can
# commit the captured drift file. Restore to `contents: read` when the
# diagnostic step is removed.
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Prove the data against the official NFL.com standings
        run: python3 tools/verify.py
      - name: Check the price store, the origination card and the results feed
        run: python3 tools/market_store.py
      - name: Rebuild the published numbers and the site
        run: |
          python3 tools/build.py
          python3 tools/pages.py
          python3 tools/sync.py
      - name: Check the published site and the repository-root copy
        run: |
          python3 site/check.py
          python3 site/check.py .
      - name: Check the X4 Console (docs/) for broken links and unsourced rows
        run: node docs/check.js
      - name: "T32 diagnostic: record the reproducibility drift into the branch"
        if: always()
        run: |
          set +e +o pipefail
          OUT=research/verification/ci-drift-2026-11-14.txt
          {
            echo "== environment =="
            python3 -c "import sys, platform; print('python:', sys.version.replace(chr(10),' ')); print('platform:', platform.platform())"
            ldd --version | head -1
            node --version
            echo "LANG=$LANG LC_ALL=$LC_ALL TZ=$TZ"
            git log -1 --format='commit %H %s'
            echo
            echo "== numstat (tracked drift) =="
            git diff --numstat -- site data research '*.html' '*.css' '*.js'
            echo
            echo "== name-status =="
            git diff --name-status -- site data research '*.html' '*.css' '*.js'
            echo
            echo "== full diff, first 5000 lines =="
            git diff -- site data research '*.html' '*.css' '*.js' | head -n 5000
          } > "$OUT" 2>&1
          wc -l "$OUT"
          git add "$OUT"
          git -c user.name="t32-diag" -c user.email="t32-diag@users.noreply.github.com" commit -m "diag(T32): capture the CI reproducibility drift [skip ci]"
          git push origin "HEAD:$GITHUB_REF_NAME"
      - name: Confirm the published output is reproducible
        run: |
          git diff --exit-code -- site data research *.html *.css *.js || (
            echo "::error::The committed output does not match a fresh build."
            echo "Run 'python3 tools/build.py && python3 tools/pages.py && python3 tools/sync.py' and commit the result."
            exit 1
          )
      - name: Add the X4 Console (docs/) to the published artifact
        run: |
          rm -rf site/console
          mkdir -p site/console
          cp -R docs/. site/console/
          rm -f site/console/check.js
      - name: Confirm the repository-root mirror is in step
        run: |
          diff -rq --exclude=check.js docs console
          diff -rq --exclude=check.py --exclude=site --exclude=console --exclude=docs \
            --exclude=data --exclude=tools --exclude=research --exclude=.git \
            --exclude=.github --exclude=README.md --exclude=COORDINATION.md \
            --exclude=.gitignore site .
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

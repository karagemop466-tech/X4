name: Validate site

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links, anchors, navigation and data-row sources
        run: python3 tools/check_site.py
      - name: Recompute statistics (integrity assertions must hold)
        run: python3 tools/compute_stats.py
      - name: Verify data page regenerates identically from CSVs
        run: |
          python3 tools/gen_data_html.py
          git diff --exit-code -- data.html

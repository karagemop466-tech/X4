name: Publish NFL Decision Lab
on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify dashboard anchors and local assets
        run: python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Check(HTMLParser):
              def __init__(self): super().__init__(); self.ids=set(); self.links=[]
              def handle_starttag(self, tag, attrs):
                  a=dict(attrs)
                  if 'id' in a: self.ids.add(a['id'])
                  if tag=='a' and 'href' in a: self.links.append(a['href'])
          p=Path('site/index.html'); c=Check(); c.feed(p.read_text())
          missing=[x[1:] for x in c.links if x.startswith('#') and x[1:] not in c.ids]
          assert not missing, f'Broken anchors: {missing}'
          assert c.ids, 'No document IDs found'
          print(f'Checked {len(c.ids)} anchors and {len(c.links)} links')
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

name: Official capture (injury report and club depth pages)

# Captures the official NFL.com injury report and every club's official depth-chart
# page, stores the raw bytes with SHA-256 hashes, UTC fetch times and a schema check,
# and commits only what changed. Every run appends a manifest line, so freshness is
# visible even when nothing moved. Any fetch or schema failure fails this job, which
# is how a page change or outage is alerted (GitHub notifies the repository on a
# failed scheduled run). See tools/capture_official.py.
#
# [skip ci] on the commit stops the capture from triggering a site rebuild every run;
# the site is rebuilt only from committed datasets, and captures are not published.

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: official-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch, schema-check and store the official pages
        run: python3 tools/capture_official.py fetch --kind all
      - name: Verify every stored hash (immutability)
        run: python3 tools/capture_official.py verify
      - name: Freshness (the newest capture must be under 13 hours old)
        run: python3 tools/capture_official.py freshness --max-hours 13
      - name: Commit new captures and manifest lines
        run: |
          git config user.name "official-capture"
          git config user.email "official-capture@users.noreply.github.com"
          git add data/captures
          if git diff --cached --quiet; then
            echo "nothing new to commit"
          else
            git commit -m "capture: official pages $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

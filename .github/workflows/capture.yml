name: Official capture (injury report and club depth pages)

# Capture the NFL injury report and each club's structured official depth chart.
# The Houston chart is image-only and intentionally excluded (flag F-24); it is not
# silently treated as a successful source.
#
# Only the manifest is committed: URL, UTC time, HTTP status, bytes, SHA-256 and the
# schema result of every read. Raw page bytes are NOT committed (public repository;
# the brief keeps raw row-level data private). They are written only to a private store
# named by X4_CAPTURE_RAW_DIR, which this workflow does not set. See tools/capture_official.py.
#
# Capture errors are committed to the manifest before the workflow fails, so repeated
# failures stay on record and a later successful run shows recovery.

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: official-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test capture and freshness gates without network access
        run: python3 -m unittest discover -s tests -p 'test_capture_official.py'
      - name: Fetch every structured official source and record failures
        id: fetch
        continue-on-error: true
        run: python3 tools/capture_official.py fetch --kind all
      - name: Verify every stored hash (immutability)
        id: verify
        continue-on-error: true
        run: python3 tools/capture_official.py verify
      - name: Require freshness for every expected source
        id: freshness
        continue-on-error: true
        run: python3 tools/capture_official.py freshness --kind all --max-hours 13
      - name: Commit capture bytes and manifest, including failure evidence
        id: persist
        run: |
          git config user.name "official-capture"
          git config user.email "official-capture@users.noreply.github.com"
          git add data/captures
          if git diff --cached --quiet; then
            echo "nothing new to commit"
          else
            git commit -m "capture: official pages $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Fail after preserving capture diagnostics
        if: always()
        env:
          FETCH_OUTCOME: ${{ steps.fetch.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          FRESHNESS_OUTCOME: ${{ steps.freshness.outcome }}
          PERSIST_OUTCOME: ${{ steps.persist.outcome }}
        run: |
          echo "fetch=${FETCH_OUTCOME} verify=${VERIFY_OUTCOME} freshness=${FRESHNESS_OUTCOME} persist=${PERSIST_OUTCOME}"
          if [ "${FETCH_OUTCOME}" != "success" ] || \
             [ "${VERIFY_OUTCOME}" != "success" ] || \
             [ "${FRESHNESS_OUTCOME}" != "success" ] || \
             [ "${PERSIST_OUTCOME}" != "success" ]; then
            echo "::error::One or more official capture gates failed; manifest evidence has been persisted when possible."
            exit 1
          fi

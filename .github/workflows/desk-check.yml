name: Desk validation

# Validation only - this workflow never deploys, so it cannot race "Publish NFL Decision Lab".
# It gates the decision-desk pages (session 5c48ced7): links, anchors, navigation,
# one https source per data row, mirror parity with site/, and reproducible statistics.

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Desk page gate (links, anchors, nav, data-row sources, site/ mirror)
        run: python3 tools/check_site.py
      - name: Depth dataset regenerates byte-identically from the club charts
        run: |
          python3 tools/depth.py
          git diff --exit-code -- data/depth-wk11-2026.csv data/output/depth.json
      - name: Statistics reproduce with integrity assertions
        run: python3 tools/compute_stats.py > /dev/null
      - name: Desk tables regenerate byte-identically from the committed CSVs
        run: |
          python3 tools/gen_data_html.py
          python3 tools/gen_strategies_html.py
          git diff --exit-code -- data.html signals.html site/data.html site/signals.html
      - name: Integrity datasets and the programme/workbench pages regenerate byte-identically
        run: |
          python3 tools/build_integrity.py
          python3 tools/gen_programme.py
          python3 tools/gen_workbench.py
          git diff --exit-code -- site/programme.html programme.html site/workbench.html workbench.html research/data
